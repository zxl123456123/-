name: Windows exe

on:
  push:
    branches:
      - cursor/liquid-glass-37dc
      - cursor/note-surface-37dc
      - cursor/suishouji-transparent-todo-37dc
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Upload suishouji.exe
        uses: actions/upload-artifact@v4
        with:
          name: suishouji-windows
          path: target/release/suishouji.exe
          if-no-files-found: error

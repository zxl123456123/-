[package]
name = "suishouji"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "轻量、可调透明度的桌面随手记"
license = "MIT"
publish = false

[dependencies]
ab_glyph = "0.2"
dirs = "5"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
